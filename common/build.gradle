plugins {
	id 'dev.architectury.loom-no-remap'
	id 'dev.architectury.loom'
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
}

base {
	archivesName = "${rootProject.archives_base_name}-common"
}


loom {
	accessWidenerPath = project.file('src/main/resources/fortniteinminecraft.accesswidener')
}

workspaceDependencies {
	siblingMaven('HudRendererLib') {
		coordinate.set("io.github.brainage04:hudrendererlib:${rootProject.hudrendererlib_version}")
		siblingDirectory.set(rootProject.layout.projectDirectory.dir('../HudRendererLib'))
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	compileOnly "io.github.brainage04:hudrendererlib:${rootProject.hudrendererlib_version}"
	testImplementation platform('org.junit:junit-bom:6.0.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}
