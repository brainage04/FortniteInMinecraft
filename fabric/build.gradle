plugins {
	id 'io.github.brainage04.fabric-mod-conventions' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}

base {
	archivesName = rootProject.archives_base_name
}

sourceSets {
	gametest {
		java.srcDir rootProject.file('src/gametest/java')
		java.srcDir project.file('src/gametest/java')
		resources.srcDir rootProject.file('src/gametest/resources')
	}
}

loom {
	accessWidenerPath = rootProject.file('src/main/resources/fortniteinminecraft.accesswidener')
	mods {
		main {
			sourceSet sourceSets.main
			sourceSet project(':common').sourceSets.main
		}
	}
	runs {
		client {
			runDir 'run/client'
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

workspaceDependencies {
	siblingMaven('FabricModdingConventions') {
		coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}")
		siblingDirectory.set(rootProject.layout.projectDirectory.dir('../FabricModdingConventions'))
	}
	siblingMaven('HudRendererLib') {
		coordinate.set("io.github.brainage04:hudrendererlib:${project.hudrendererlib_version}")
		siblingDirectory.set(rootProject.layout.projectDirectory.dir('../HudRendererLib'))
	}
}

fabricModConventions {
	additionalFabricModJsonProperties.add('hudrendererlib_version')
}

modPublishing {
	github.repository.set('brainage04/FortniteInMinecraft')
	licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
	modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
	modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
	modrinth.iconFile.set(rootProject.layout.projectDirectory.file('src/main/resources/assets/fortniteinminecraft/icon.png'))
}

productionGameTests {
	includeServer = true
}

dependencies {
	common(project(':common')) { transitive = false }
	implementation "io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"
	implementation "io.github.brainage04:hudrendererlib:${project.hudrendererlib_version}"
	productionRuntimeMods "io.github.brainage04:hudrendererlib:${project.hudrendererlib_version}"
}

tasks.named('jar') {
	from project(':common').sourceSets.main.output
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar') {
	from project(':common').sourceSets.main.allSource
}

tasks.matching { it.name.startsWith('run') }.configureEach {
	dependsOn project(':common').tasks.named('jar')
}
