name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      fabric_file: ${{ steps.artifacts.outputs.fabric_file }}
      minecraft_version: ${{ steps.artifacts.outputs.minecraft_version }}
      neoforge_file: ${{ steps.artifacts.outputs.neoforge_file }}
      release_type: ${{ steps.artifacts.outputs.release_type }}
      version: ${{ steps.artifacts.outputs.version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: build both loader artifacts
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: collect exact loader artifacts
        id: artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          ARCHIVES_NAME="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          FABRIC_FILE="${ARCHIVES_NAME}-${VERSION}.jar"
          NEOFORGE_FILE="${ARCHIVES_NAME}-neoforge-${VERSION}.jar"
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "Expected tag v${VERSION}, got ${TAG_NAME}"
            exit 1
          fi
          test -f "fabric/build/libs/${FABRIC_FILE}"
          test -f "neoforge/build/libs/${NEOFORGE_FILE}"
          mkdir -p release-artifacts
          cp "fabric/build/libs/${FABRIC_FILE}" "release-artifacts/${FABRIC_FILE}"
          cp "neoforge/build/libs/${NEOFORGE_FILE}" "release-artifacts/${NEOFORGE_FILE}"
          {
            echo "fabric_file=${FABRIC_FILE}"
            echo "minecraft_version=${MINECRAFT_VERSION}"
            echo "neoforge_file=${NEOFORGE_FILE}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "release_type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: resolve release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="$(git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)')"
          if [ -z "${NOTES}" ]; then
            NOTES="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${RELEASE_TAG}" \
              -f "target_commitish=${GITHUB_SHA}" \
              --jq '.body')"
          fi
          printf '%s\n' "${NOTES}" > release-artifacts/release-notes.md

      - name: upload release inputs
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  github:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download release inputs
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts

      - name: publish both loader JARs to GitHub
        uses: Kira-NT/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/${{ needs.prepare.outputs.fabric_file }}
            release-artifacts/${{ needs.prepare.outputs.neoforge_file }}
          name: Fortnite In Minecraft ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}
          version-type: ${{ needs.prepare.outputs.release_type }}
          changelog-file: release-artifacts/release-notes.md

  modrinth-project:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: check Modrinth token
        id: config
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Modrinth project synchronization because its token is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: validate gradle wrapper
        if: steps.config.outputs.enabled == 'true'
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft

      - name: setup gradle
        if: steps.config.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: synchronize Modrinth project metadata
        if: steps.config.outputs.enabled == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_DESCRIPTION: ${{ github.event.repository.description }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :fabric:syncModrinthIcon -PpublishModrinth=true

  distribution:
    needs:
      - prepare
      - modrinth-project
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            display_name: Fabric
          - loader: neoforge
            display_name: NeoForge
    steps:
      - name: download release inputs
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts

      - name: publish loader JAR to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        uses: Kira-NT/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: fortniteinminecraft
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: release-artifacts/${{ matrix.loader == 'fabric' && needs.prepare.outputs.fabric_file || needs.prepare.outputs.neoforge_file }}
          name: Fortnite In Minecraft ${{ needs.prepare.outputs.version }} (${{ matrix.display_name }})
          version: ${{ needs.prepare.outputs.version }}+${{ matrix.loader }}
          version-type: ${{ needs.prepare.outputs.release_type }}
          changelog-file: release-artifacts/release-notes.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ needs.prepare.outputs.minecraft_version }}
          environment: 'client | server'
          java: '25'

      - name: publish loader JAR to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kira-NT/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ matrix.loader == 'fabric' && needs.prepare.outputs.fabric_file || needs.prepare.outputs.neoforge_file }}
          name: Fortnite In Minecraft ${{ needs.prepare.outputs.version }} (${{ matrix.display_name }})
          version: ${{ needs.prepare.outputs.version }}+${{ matrix.loader }}
          version-type: ${{ needs.prepare.outputs.release_type }}
          changelog-file: release-artifacts/release-notes.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ needs.prepare.outputs.minecraft_version }}
          environment: 'client | server'
          java: '25'
